[project]
name = "hostel-ticket-system"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "django-environ>=0.11.2",
    "django-filter>=24.0",
    "Pillow>=10.2.0",
    "whitenoise>=6.6.0",
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | staticfiles
  | media
)/
'''
