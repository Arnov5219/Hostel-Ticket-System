{% load ui %}

<div class="card" style="margin-top: 8px; border: 1px solid var(--border-strong); background-color: var(--bg-surface); padding: 12px 14px; box-shadow: var(--shadow-sm); border-radius: var(--radius-md);">
  <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--fs-xs); color: var(--accent); margin-bottom: 8px;">
    <i data-lucide="info" style="width: 14px; height: 14px;"></i>
    <span>Already reported in your hostel. Repost instead of creating a duplicate?</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    {% for ticket in similar_tickets %}
      <div id="similar-ticket-row-{{ ticket.ticket_no }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; background-color: var(--bg-subtle); border-radius: var(--radius-xs);">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 600; font-size: var(--fs-xs); color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
            {{ ticket.title }}
          </div>
          <div style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span>{{ ticket.ticket_no }}</span>
            <span>·</span>
            <span>{{ ticket.get_status_display }}</span>
            <span>·</span>
            <span>{{ ticket.repost_count }} repost{{ ticket.repost_count|pluralize }}</span>
          </div>
        </div>

        <button type="button"
                class="btn btn-secondary btn-xs"
                hx-post="{% url 'tickets:repost' ticket.ticket_no %}"
                hx-target="#similar-ticket-row-{{ ticket.ticket_no }}"
                hx-swap="outerHTML"
                style="white-space: nowrap; font-size: 11px;">
          <i data-lucide="repeat" style="width: 12px; height: 12px;"></i>
          <span>Repost instead</span>
        </button>
      </div>
    {% endfor %}
  </div>
</div>
