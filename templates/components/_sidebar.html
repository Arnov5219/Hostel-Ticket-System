<aside class="app-rail">
  <a href="{% url 'core:home' %}" class="rail-logo" title="Hostel Ticket System">
    H
  </a>

  <nav class="rail-nav">
    {% for item in navigation.sidebar_items %}
      <a href="{{ item.url }}" class="rail-item {% if current_section == item.section or is_kanban and item.key == 'kanban' or not is_kanban and item.key == 'tickets' and current_section == 'tickets' %}active{% endif %}" title="{{ item.label }}">
        <i data-lucide="{{ item.icon }}" style="width: 20px; height: 20px;"></i>
        {% if item.badge_key and unread_notifications_count > 0 %}
          <span style="position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background-color: var(--st-open-dot);"></span>
        {% endif %}
        <span class="rail-tooltip">{{ item.label }}</span>
      </a>
    {% endfor %}
  </nav>

  <div class="rail-bottom">
    <a href="{% url 'accounts:profile' %}" class="rail-item {% if current_section == 'profile' %}active{% endif %}" title="Profile &amp; Settings">
      <i data-lucide="user-circle" style="width: 20px; height: 20px;"></i>
      <span class="rail-tooltip">Profile</span>
    </a>
  </div>
</aside>
