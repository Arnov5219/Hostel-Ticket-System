{% if rooms %}
  <div class="room-chip-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding: 6px; border: 1px solid var(--border-glass); border-radius: var(--radius-md); background: var(--bg-surface-glass);">
    {% for room in rooms %}
      <button type="button"
              class="room-chip {% if selected_id == room.id|stringformat:'s' %}selected{% endif %}"
              data-room-id="{{ room.id }}"
              data-room-number="{{ room.room_number }}"
              title="Room {{ room.room_number }} ({{ room.resident_count }}/{{ room.capacity }} beds)"
              onclick="selectRoomChip(this, '{{ room.id }}')"
              style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 6px; border-radius: var(--radius-sm); border: 1px solid {% if selected_id == room.id|stringformat:'s' %}var(--accent){% else %}var(--border){% endif %}; background: {% if selected_id == room.id|stringformat:'s' %}var(--accent-glow){% else %}var(--bg-surface){% endif %}; cursor: pointer; transition: all var(--duration-fast) var(--ease-standard); font-family: var(--font-mono); font-size: var(--fs-xs); position: relative;">
        
        <span style="font-weight: 600; color: {% if selected_id == room.id|stringformat:'s' %}var(--accent){% else %}var(--text-primary){% endif %};">
          {{ room.room_number }}
        </span>

        <span style="display: flex; align-items: center; gap: 3px; font-size: 10px; margin-top: 2px; color: var(--text-muted);">
          <span style="width: 5px; height: 5px; border-radius: 50%; background: {% if room.resident_count >= room.capacity %}var(--st-open-dot){% elif room.resident_count > 0 %}var(--st-progress-dot){% else %}var(--st-resolved-dot){% endif %};"></span>
          {{ room.resident_count }}/{{ room.capacity }}
        </span>
      </button>
    {% endfor %}
  </div>
  <div id="room-selection-hint" style="font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 6px;">
    Select a room from the grid above.
  </div>
{% else %}
  <div style="font-size: var(--fs-xs); color: var(--text-muted); font-style: italic; padding: 12px 0; text-align: center;">
    No rooms available for the selected floor.
  </div>
{% endif %}

<script>
if (typeof selectRoomChip === 'undefined') {
  window.selectRoomChip = function(btn, roomId) {
    document.querySelectorAll('.room-chip').forEach(el => {
      el.style.borderColor = 'var(--border)';
      el.style.background = 'var(--bg-surface)';
      const span = el.querySelector('span');
      if (span) span.style.color = 'var(--text-primary)';
      el.classList.remove('selected');
    });
    btn.classList.add('selected');
    btn.style.borderColor = 'var(--accent)';
    btn.style.background = 'var(--accent-glow)';
    const span = btn.querySelector('span');
    if (span) span.style.color = 'var(--accent)';

    const hiddenInput = document.getElementById('id_room');
    if (hiddenInput) {
      hiddenInput.value = roomId;
      hiddenInput.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const hint = document.getElementById('room-selection-hint');
    if (hint) {
      hint.innerHTML = 'Selected room: <strong>#' + btn.getAttribute('data-room-number') + '</strong>';
    }
  };
}
</script>
