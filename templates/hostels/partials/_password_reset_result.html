<div style="background-color: var(--st-resolved-bg); border: 1px solid var(--st-resolved-dot); border-radius: var(--radius-md); padding: 16px; margin-top: 12px; color: var(--st-resolved-fg);">
  <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--fs-sm); margin-bottom: 6px;">
    <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i>
    <span>Password reset successful for {{ target.login_id }}</span>
  </div>
  <p style="font-size: var(--fs-xs); margin: 0 0 10px; color: var(--text-secondary);">
    This temporary password is displayed <strong>only once</strong> and is never stored in plain text. Share it securely with the staff member.
  </p>
  <div style="display: flex; align-items: center; gap: 8px;">
    <input type="text" id="temp-pw-field" value="{{ temp_password }}" readonly class="form-control"
           style="font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.05em; background: var(--bg-surface); color: var(--text-primary); max-width: 260px;">
    <button type="button" class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('{{ temp_password }}'); this.innerText='Copied!';">
      Copy password
    </button>
  </div>
</div>
