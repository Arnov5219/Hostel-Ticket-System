<div id="toast-delete-{{ ticket_no|default:ticket.ticket_no }}" class="toast toast-delete info" {% if is_oob %}hx-swap-oob="beforeend:#toast-container"{% endif %} x-data="{ countdown: 8, timer: null }" x-init="timer = setInterval(() => { countdown--; if (countdown <= 0) { clearInterval(timer); $el.remove(); } }, 1000)" style="display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 280px; max-width: 100%;">
  <div style="display: flex; align-items: center; gap: var(--sp-2);">
    <span style="font-size: var(--text-sm); font-weight: 500;">Ticket #{{ ticket_no|default:ticket.ticket_no }} deleted.</span>
    <span style="font-size: var(--text-xs); color: var(--text-muted);" x-text="'(' + countdown + 's)'"></span>
  </div>
  <div style="display: flex; align-items: center; gap: var(--sp-2);">
    <form method="post" action="{% url 'tickets:undo_delete' ticket_no=ticket_no|default:ticket.ticket_no %}" style="margin: 0; display: inline;">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ undo_token|default:token }}">
      <button type="submit" class="btn btn-sm btn-outline" style="padding: 2px 8px; font-size: var(--text-xs); font-weight: 600; color: var(--accent); border-color: var(--border-strong);">
        Undo
      </button>
    </form>
    <button type="button" class="toast-close" onclick="dismissToast(this.closest('.toast'));" aria-label="Close message">✕</button>
  </div>
</div>
