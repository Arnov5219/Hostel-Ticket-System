<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hostel Ticket System</title>
  <style>
    :root {
      --bg: #0b1220;
      --card-bg: #111a2e;
      --border: #243049;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .container {
      max-width: 380px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 38px 24px 30px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 35px -5px rgba(37, 99, 235, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px 4px rgba(59, 130, 246, 0.45);
      margin-bottom: 4px;
    }
    .logo-svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin: 0;
    }
    .tagline {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: -6px;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      animation: progress-indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes progress-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    .btn {
      display: none;
      width: 100%;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      margin-top: 10px;
    }
    .btn:active {
      background-color: var(--primary-hover);
    }
    .status-msg {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 10V26M26 10V26M10 18H26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>HostelFlow</h1>
    <div class="tagline" id="desc">Connecting to HostelFlow services...</div>
    <div class="progress-track" id="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="status-msg" id="status-msg"></div>
    <button class="btn" id="retry-btn" onclick="retryConnection()">Retry Connection</button>
  </div>

  <script>
    const serverUrl = window.__SERVER_URL__ || window.location.origin;
    const descEl = document.getElementById('desc');
    const progressTrackEl = document.getElementById('progress-track');
    const retryBtn = document.getElementById('retry-btn');
    const statusMsg = document.getElementById('status-msg');

    function checkOnline() {
      if (!navigator.onLine) {
        showOfflineState('No internet connection. Please check your Wi-Fi or mobile data.');
      } else {
        attemptConnect();
      }
    }

    function showOfflineState(message) {
      if (progressTrackEl) progressTrackEl.style.display = 'none';
      retryBtn.style.display = 'block';
      descEl.textContent = message;
      statusMsg.textContent = 'Offline';
      statusMsg.style.color = '#f87171';
    }

    function attemptConnect() {
      if (progressTrackEl) progressTrackEl.style.display = 'block';
      retryBtn.style.display = 'none';
      descEl.textContent = 'Connecting to server...';
      statusMsg.textContent = '';

      fetch(serverUrl + '/health/', { method: 'GET', cache: 'no-store' })
        .then(res => {
          if (res.ok || res.status < 500) {
            window.location.href = serverUrl;
          } else {
            showOfflineState('Server temporarily unavailable (Status ' + res.status + ').');
          }
        })
        .catch(err => {
          // If health endpoint fails, check root
          fetch(serverUrl, { method: 'HEAD', mode: 'no-cors' })
            .then(() => {
              window.location.href = serverUrl;
            })
            .catch(() => {
              showOfflineState('Unable to reach Hostel Ticket server. Tap retry when connected.');
            });
        });
    }

    function retryConnection() {
      checkOnline();
    }

    window.addEventListener('online', attemptConnect);
    window.addEventListener('offline', () => showOfflineState('Connection lost. Please check your network.'));

    // Initial check after brief timeout to avoid flicker if loaded locally
    setTimeout(checkOnline, 400);
  </script>
</body>
</html>
